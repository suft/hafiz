name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # CI builds are never published; they sign the release APK with the debug key so it can be built at all.
      HAFIZ_ALLOW_DEBUG_SIGNING: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: gradle/actions/setup-gradle@v6 # caches Gradle and validates the wrapper jar
      - run: mise run test
      - run: mise run lint
      - run: mise run build
      - run: mise run release
      - uses: actions/upload-artifact@v7
        with:
          name: Hafiz-debug
          path: dist/Hafiz-debug.apk
