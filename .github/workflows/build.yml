name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # CI builds are never published; they sign with the debug key so the minified release bundle (R8) is checked.
      HAFIZ_ALLOW_DEBUG_SIGNING: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1 # caches Gradle and validates the wrapper jar
      - run: mise run test
      - run: mise run lint
      - run: mise run build
      - run: mise run bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Hafiz-debug
          path: dist/Hafiz-debug.apk
