name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAFIZ_KEYSTORE_PASSWORD: ${{ secrets.HAFIZ_KEYSTORE_PASSWORD }}
      HAFIZ_KEY_ALIAS: ${{ secrets.HAFIZ_KEY_ALIAS }}
      HAFIZ_KEY_PASSWORD: ${{ secrets.HAFIZ_KEY_PASSWORD }}
      HAFIZ_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: gradle/actions/setup-gradle@v6 # caches Gradle and validates the wrapper jar
      - name: Check tag against versionName
        id: version
        run: |
          set -euo pipefail
          versionName=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          versionCode=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          if [ "v$versionName" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $versionName" >&2
            exit 1
          fi
          echo "version_code=$versionCode" >> "$GITHUB_OUTPUT"
      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.HAFIZ_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$HAFIZ_KEYSTORE_FILE"
          if [ ! -s "$HAFIZ_KEYSTORE_FILE" ]; then
            echo "HAFIZ_KEYSTORE_BASE64 secret is missing" >&2
            exit 1
          fi
      - run: mise run check
      - run: mise run release
      - run: mise run bundle
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Hafiz-release.apk dist/Hafiz-release.aab \
            --title "Hafiz $GITHUB_REF_NAME" \
            --notes-file fastlane/metadata/android/en-US/changelogs/${{ steps.version.outputs.version_code }}.txt
