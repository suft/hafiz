name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1 # caches Gradle and validates the wrapper jar
      - name: Check tag against versionName
        id: version
        run: |
          set -euo pipefail
          versionName=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          versionCode=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          if [ "v$versionName" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $versionName" >&2
            exit 1
          fi
          for dir in fastlane/metadata/android/*/; do
            if [ ! -s "${dir}changelogs/$versionCode.txt" ]; then
              echo "Missing ${dir}changelogs/$versionCode.txt" >&2
              exit 1
            fi
          done
          echo "version_code=$versionCode" >> "$GITHUB_OUTPUT"
      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.HAFIZ_KEYSTORE_BASE64 }}
        run: |
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$keystore"
          if [ ! -s "$keystore" ]; then
            echo "HAFIZ_KEYSTORE_BASE64 secret is missing" >&2
            exit 1
          fi
          echo "HAFIZ_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"
      - run: mise run check
      - name: Build signed APK
        env:
          HAFIZ_KEYSTORE_PASSWORD: ${{ secrets.HAFIZ_KEYSTORE_PASSWORD }}
          HAFIZ_KEY_ALIAS: ${{ secrets.HAFIZ_KEY_ALIAS }}
          HAFIZ_KEY_PASSWORD: ${{ secrets.HAFIZ_KEY_PASSWORD }}
        run: mise run release
      - name: Build signed bundle
        env:
          HAFIZ_KEYSTORE_PASSWORD: ${{ secrets.HAFIZ_KEYSTORE_PASSWORD }}
          HAFIZ_KEY_ALIAS: ${{ secrets.HAFIZ_KEY_ALIAS }}
          HAFIZ_KEY_PASSWORD: ${{ secrets.HAFIZ_KEY_PASSWORD }}
        run: mise run bundle
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Hafiz-release.apk dist/Hafiz-release.aab \
            --title "Hafiz $GITHUB_REF_NAME" \
            --notes-file fastlane/metadata/android/en-US/changelogs/${{ steps.version.outputs.version_code }}.txt
