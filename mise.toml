# mise configuration for Hafiz
#
#   mise install          # installs the JDK pinned below
#   mise run setup        # downloads the Android SDK packages the build needs
#   mise run build        # builds a debug APK  -> dist/
#   mise run release      # builds a release APK -> dist/
#   mise tasks            # lists every task
#
# Docs: https://mise.jdx.dev

min_version = "2024.9.0"

[tools]
# AGP 9.x needs JDK 17+; 21 is the current LTS that every tool in this build supports.
java = "temurin-21"

[env]
# Re-use an existing SDK (Android Studio, CI images…) when ANDROID_HOME is already set,
# otherwise keep a self-contained SDK inside the project.
ANDROID_HOME = "{{ get_env(name='ANDROID_HOME', default=config_root ~ '/.android-sdk') }}"
ANDROID_SDK_ROOT = "{{ get_env(name='ANDROID_HOME', default=config_root ~ '/.android-sdk') }}"
# Versions of the SDK packages installed by `mise run setup`. Keep in sync with app/build.gradle.kts.
ANDROID_PLATFORM = "android-37.0"
ANDROID_BUILD_TOOLS = "36.0.0"
# Pinned Android command-line tools build (https://developer.android.com/studio#command-tools).
ANDROID_CMDLINE_TOOLS_BUILD = "11076708"
_.path = [
  "{{ get_env(name='ANDROID_HOME', default=config_root ~ '/.android-sdk') }}/cmdline-tools/latest/bin",
  "{{ get_env(name='ANDROID_HOME', default=config_root ~ '/.android-sdk') }}/platform-tools",
]

# ---------------------------------------------------------------------------
# Tasks
# ---------------------------------------------------------------------------

[tasks.sdk]
description = "Download the Android command-line tools and the SDK packages used by the build"
run = '''
#!/usr/bin/env bash
set -euo pipefail

SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

if [ ! -x "$SDKMANAGER" ]; then
  case "$(uname -s)" in
    Linux*)  os=linux ;;
    Darwin*) os=mac ;;
    MINGW*|MSYS*|CYGWIN*) os=win ;;
    *) echo "Unsupported OS: $(uname -s)" >&2; exit 1 ;;
  esac
  url="https://dl.google.com/android/repository/commandlinetools-${os}-${ANDROID_CMDLINE_TOOLS_BUILD}_latest.zip"
  echo "→ Downloading Android command-line tools ($os) into $ANDROID_HOME"
  tmp="$(mktemp -d)"
  trap 'rm -rf "$tmp"' EXIT
  curl -fL --progress-bar -o "$tmp/cmdline-tools.zip" "$url"
  unzip -q "$tmp/cmdline-tools.zip" -d "$tmp"
  mkdir -p "$ANDROID_HOME/cmdline-tools"
  rm -rf "$ANDROID_HOME/cmdline-tools/latest"
  mv "$tmp/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
fi

echo "→ Accepting SDK licenses"
yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true

echo "→ Installing platform-tools, platforms;$ANDROID_PLATFORM, build-tools;$ANDROID_BUILD_TOOLS"
"$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
  "platform-tools" \
  "platforms;$ANDROID_PLATFORM" \
  "build-tools;$ANDROID_BUILD_TOOLS"

# Point Gradle at the SDK even when it is run outside mise (e.g. from Android Studio).
printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
echo "✓ Android SDK ready at $ANDROID_HOME"
'''

[tasks.setup]
description = "One-time setup: JDK (via mise) + Android SDK"
depends = ["sdk"]
run = "echo '✓ Setup complete. Next: mise run build'"

[tasks.build]
description = "Build the debug APK and copy it to dist/"
alias = "b"
run = '''
#!/usr/bin/env bash
set -euo pipefail
[ -f local.properties ] || mise run sdk
./gradlew :app:assembleDebug
mkdir -p dist
cp app/build/outputs/apk/debug/app-debug.apk dist/Hafiz-debug.apk
echo "✓ dist/Hafiz-debug.apk"
'''

[tasks.release]
description = "Build the minified release APK (needs keystore.properties, HAFIZ_KEYSTORE_* or HAFIZ_ALLOW_DEBUG_SIGNING=1)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
[ -f local.properties ] || mise run sdk
./gradlew :app:assembleRelease
mkdir -p dist
cp app/build/outputs/apk/release/app-release.apk dist/Hafiz-release.apk
echo "✓ dist/Hafiz-release.apk"
'''

[tasks.bundle]
description = "Build a release Android App Bundle (.aab) for Google Play (needs keystore.properties, HAFIZ_KEYSTORE_* or HAFIZ_ALLOW_DEBUG_SIGNING=1)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
[ -f local.properties ] || mise run sdk
./gradlew :app:bundleRelease
mkdir -p dist
cp app/build/outputs/bundle/release/app-release.aab dist/Hafiz-release.aab
echo "✓ dist/Hafiz-release.aab"
'''

[tasks.store-graphics]
description = "Render the Play Store icon (512x512) and feature graphic (1024x500) into fastlane/metadata/android/ar/images/ (needs ImageMagick 7: magick)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
command -v magick > /dev/null || { echo "ImageMagick 7 (magick) is required" >&2; exit 1; }
res=app/src/main/res
out=fastlane/metadata/android/ar/images
mkdir -p "$out"
# Play icon = the adaptive launcher icon's full 108dp canvas (background colour + foreground); Play applies the mask.
bg=$(sed -n 's:.*name="ic_launcher_background">\(#[0-9A-Fa-f]*\)<.*:\1:p' "$res/values/colors.xml")
magick -size 512x512 "xc:$bg" \( "$res/mipmap-xxxhdpi/ic_launcher_foreground.png" -resize 512x512 \) \
  -composite -strip "PNG32:$out/icon.png"
# Feature graphic: paper texture cropped to 1024x500 with the Hafiz artwork centred. Play rejects alpha here.
magick "$res/drawable-nodpi/paper_background.jpg" -resize 1024x -gravity center -extent 1024x500 \
  \( "$res/drawable-nodpi/hafiz.png" -resize 440x440 \) -gravity center -composite \
  -alpha off -strip "PNG24:$out/featureGraphic.png"
echo "✓ $out/icon.png, $out/featureGraphic.png"
'''

[tasks.test]
description = "Run JVM unit tests (question generator, levels, stats, progress) and the Robolectric UI tests"
alias = "t"
run = "./gradlew :app:testDebugUnitTest"

[tasks.mutashabihat]
description = "Re-download Aswaatul Qurraa's mutashabihat and regenerate app/src/main/assets/mutashabihat.txt (needs python3; --offline just merges tools/mutashabihat_supplement.txt)"
run = "python3 tools/mutashabihat.py"

[tasks.mushaf-layout]
description = "Re-download the Madinah mushaf (1405H) page/line of every ayah from quran.com and regenerate app/src/main/assets/mushaf_layout.txt (needs python3)"
run = "python3 tools/mushaf_layout.py"

[tasks.reciters]
description = "Check that every reciter has all 6236 ayah files on everyayah.com (needs python3)"
run = "python3 tools/check_reciters.py"

[tasks.lint]
description = "Run Android lint"
run = "./gradlew :app:lintDebug"

[tasks.check]
description = "Unit tests + lint"
depends = ["test", "lint"]

[tasks.install]
description = "Build and install the debug APK on a connected device/emulator (adb)"
run = "./gradlew :app:installDebug"

[tasks.run]
description = "Install the debug APK and launch it"
depends = ["install"]
run = "adb shell am start -n suft.android.hafiz.debug/suft.android.hafiz.MainActivity"

[tasks.logcat]
description = "Follow the app's logs"
run = "adb logcat --pid=$(adb shell pidof -s suft.android.hafiz.debug)"

[tasks.keystore]
description = "Create a release keystore + keystore.properties (never commit them)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ -f keystore.properties ]; then echo "keystore.properties already exists"; exit 0; fi
read -r -s -p "Keystore password (min 6 chars): " pass; echo
# The password goes to keytool through the environment, not the command line (visible in `ps`).
export KS_PASS="$pass"
keytool -genkeypair -v -keystore release.jks -alias hafiz \
  -keyalg RSA -keysize 4096 -validity 10000 \
  -storepass:env KS_PASS -keypass:env KS_PASS \
  -dname "CN=Hafiz, O=Hafiz, C=XX"
# .properties escapes: a backslash is doubled, a leading space is escaped.
esc=$(printf '%s' "$pass" | sed -e 's/\\/\\\\/g' -e 's/^ /\\ /')
cat > keystore.properties <<EOF
storeFile=release.jks
storePassword=$esc
keyAlias=hafiz
keyPassword=$esc
EOF
chmod 600 keystore.properties release.jks
echo "✓ release.jks + keystore.properties created"
'''

[tasks.clean]
description = "Delete build outputs"
run = "./gradlew clean && rm -rf dist"
